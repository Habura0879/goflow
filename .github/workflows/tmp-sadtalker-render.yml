name: tmp-sadtalker-render
on:
  push:
    branches: [tmp-media-bridge]
    paths: ['.github/workflows/tmp-sadtalker-render.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install clients
        run: |
          pip install -q 'gradio_client>=1.3,<2'
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Prepare presenter and new Hebrew narration
        shell: bash
        run: |
          mkdir -p bridge
          cat > /tmp/presenter.b64 <<'EOF'

EOF
          base64 -d /tmp/presenter.b64 > bridge/presenter.jpg
          curl -L --fail --retry 3 -o bridge/narration.wav 'https://resource2.heygen.ai/text_to_speech/c9b05ff5325b450c8568d446d9163e8d/17b422ec8f0143538789ba38053cd298/id=1e1b7ce9-009c-4ec8-82f2-a4d76a091430.wav'
          ffmpeg -y -loglevel error -i bridge/narration.wav -ss 0 -t 4.45 bridge/opening.wav
          ffmpeg -y -loglevel error -i bridge/narration.wav -ss 22.25 -t 5.15 bridge/closing.wav
      - name: Generate genuine talking-head presenter clips
        shell: bash
        run: |
          python - <<'PY'
          from gradio_client import Client, handle_file
          import shutil, os
          c = Client('Madras1/sadtalker-api', verbose=True)
          for name in ('opening','closing'):
              result = c.predict(
                  image=handle_file('bridge/presenter.jpg'),
                  audio=handle_file(f'bridge/{name}.wav'),
                  api_name='/gradio_generate'
              )
              print(name, result)
              if isinstance(result, dict):
                  v = result.get('video') or result
                  path = v.get('path') if isinstance(v, dict) else v
              else:
                  path = result
              if not path or not os.path.exists(path):
                  raise RuntimeError(f'No generated file for {name}: {result}')
              shutil.copy2(path, f'bridge/{name}_talking.mp4')
          PY
      - name: Commit temporary generated media
        run: |
          git config user.name 'GoFlow Media Bridge'
          git config user.email 'actions@users.noreply.github.com'
          git add bridge/narration.wav bridge/opening_talking.mp4 bridge/closing_talking.mp4
          git commit -m 'Temporary generated presenter media' || true
          git push origin HEAD:tmp-media-bridge
