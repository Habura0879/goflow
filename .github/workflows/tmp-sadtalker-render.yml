name: tmp-latentsync-render
on:
  push:
    branches: [tmp-media-bridge]
    paths: ['.github/workflows/tmp-sadtalker-render.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install client and ffmpeg
        run: |
          pip install -q 'gradio_client>=1.3,<2'
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Prepare presenter clips and narration
        shell: bash
        run: |
          mkdir -p bridge
          echo '' | base64 -d > bridge/presenter.jpg
          test -f bridge/narration.wav || curl -L --fail --retry 3 -o bridge/narration.wav 'https://resource2.heygen.ai/text_to_speech/c9b05ff5325b450c8568d446d9163e8d/17b422ec8f0143538789ba38053cd298/id=1e1b7ce9-009c-4ec8-82f2-a4d76a091430.wav'
          ffmpeg -y -loglevel error -i bridge/narration.wav -ss 0 -t 4.45 bridge/opening.wav
          ffmpeg -y -loglevel error -i bridge/narration.wav -ss 22.20 -t 5.20 bridge/closing.wav
          ffmpeg -y -loglevel error -loop 1 -i bridge/presenter.jpg -t 4.45 -vf "scale=420:746,crop=360:640:x='30+8*sin(t*0.8)':y='53+5*sin(t*0.6)'" -r 25 -an -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p bridge/opening_input.mp4
          ffmpeg -y -loglevel error -loop 1 -i bridge/presenter.jpg -t 5.20 -vf "scale=420:746,crop=360:640:x='30+7*sin(t*0.7+1)':y='53+5*sin(t*0.55+0.5)'" -r 25 -an -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p bridge/closing_input.mp4
      - name: Generate real lip-sync clips with LatentSync
        shell: bash
        run: |
          python - <<'PY'
          from gradio_client import Client, handle_file
          import shutil, os
          c = Client('fffiloni/LatentSync', verbose=True)
          for name in ('opening','closing'):
              result = c.predict(
                  input_video_path=handle_file(f'bridge/{name}_input.mp4'),
                  input_audio_path=handle_file(f'bridge/{name}.wav'),
                  api_name='/generate_lip_sync_video'
              )
              print(name, result)
              path = result.get('path') if isinstance(result, dict) else result
              if isinstance(path, dict): path = path.get('path')
              if not path or not os.path.exists(path):
                  raise RuntimeError(f'No LatentSync output for {name}: {result}')
              shutil.copy2(path, f'bridge/{name}_talking.mp4')
          PY
      - name: Commit generated media
        if: always()
        run: |
          git config user.name 'GoFlow Media Bridge'
          git config user.email 'actions@users.noreply.github.com'
          git add bridge/narration.wav bridge/opening_talking.mp4 bridge/closing_talking.mp4 2>/dev/null || true
          git commit -m 'Temporary LatentSync presenter media' || true
          git push origin HEAD:tmp-media-bridge || true
