name: tmp-lipsync-probe
on:
  push:
    branches: [tmp-media-bridge]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q 'gradio_client>=1.3,<2'
      - name: Probe public lip-sync Spaces
        shell: bash
        run: |
          python - <<'PY'
          from gradio_client import Client
          spaces = [
            'Madras1/sadtalker-api',
            'akin23/SadTalker-API',
            'fffiloni/LatentSync',
          ]
          for space in spaces:
              print('\n===== SPACE', space, '=====')
              try:
                  c = Client(space, verbose=False)
                  print(c.view_api(return_format='dict'))
              except Exception as e:
                  print('ERROR:', type(e).__name__, str(e))
          PY
