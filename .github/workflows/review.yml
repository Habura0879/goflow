name: Full Website Review (No Deployment)

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proposed site without production credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate internal campaign work instructions
        run: python3 scripts/validate-work-instructions.py

      - name: Validate approved stage 2 source files
        run: |
          python3 - <<'PY'
          from pathlib import Path

          checks = {
              'index.html': [
                  '/services/data-commercialization/',
                  'id="data-opportunity"',
                  'name="phone"',
                  'מסחור מידע עסקי לחברות AI',
              ],
              'services/process-consulting/index.html': [
                  '/services/ai-business-processes/',
                  'id="ai-home-intro"',
                  'id="quiz"',
                  'name="phone"',
                  'מערכת לניהול לקוחות',
                  'הטמעת בינה מלאכותית',
              ],
              'about/index.html': [
                  'יועץ תהליכים והטמעת טכנולוגיה, אוטומציה ו־AI',
                  'מחברים טכנולוגיה נכון',
              ],
              'privacy/index.html': [
                  'data-ai-privacy="true"',
                  '8. יצירת קשר',
              ],
              'services/business-automation/index.html': ['data-ai-related="true"'],
              'services/crm-consulting/index.html': ['data-ai-related="true"'],
              'services/process-consulting/index.html': ['data-ai-related="true"'],
              'services/work-procedures/index.html': ['data-ai-related="true"'],
          }

          for filename, required in checks.items():
              text = Path(filename).read_text(encoding='utf-8')
              for needle in required:
                  if needle not in text:
                      raise SystemExit(f'Validation failed: {filename} missing {needle}')

          print('Approved stage 2 source validation passed.')
          PY

      - name: Validate phase 3 SEO source
        run: python3 scripts/phase3-seo.py

      - name: Apply and validate AI article internal links
        run: python3 scripts/add-ai-article-internal-links.py

      - name: Apply and validate direct AI article CTA
        run: python3 scripts/update-ai-article-cta.py

      - name: Apply guarded AI campaign funnel updates
        run: python3 scripts/update-ai-campaign-funnel.py

      - name: Validate AI article and blog integration
        run: python3 scripts/validate-ai-article.py

      - name: Check AI funnel JavaScript syntax
        run: |
          node --check assets/ai-service.js
          node --check assets/measured-links.js
          node --check assets/home.js

      - name: Validate AI lead to central sheet flow
        run: python3 scripts/validate-ai-lead-sheet-flow.py

      - name: Validate isolated AI campaign funnel
        run: python3 scripts/validate-ai-campaign-funnel.py

      - name: Check operations funnel JavaScript syntax
        run: |
          node --check assets/platform-short-link.js
          node --check assets/operations-lead-first.js

      - name: Validate operations lead-first funnel
        run: python3 scripts/validate-operations-funnel.py

      - name: Apply and validate phase 3 launch QA
        run: python3 scripts/phase3-qa.py

      - name: Validate reversible brokerage positioning
        run: python3 scripts/validate-brokerage-positioning.py

      - name: Validate data commercialization service page
        run: python3 scripts/validate-data-commercialization-service.py

      - name: Validate brokerage inline join modal
        run: |
          node --check assets/brokerage-join.js
          python3 scripts/validate-brokerage-join.py

      - name: Verify no deployment or repository writes occur in review
        run: |
          python3 - <<'PY'
          from pathlib import Path
          review = Path('.github/workflows/review.yml').read_text(encoding='utf-8')
          assert ('FTP' + '-Deploy-Action@') not in review
          assert ('git' + ' push origin HEAD:main') not in review
          assert 'contents: read' in review
          print('Review workflow is static and cannot deploy to FTP.')
          PY
